name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          VITE_API_BASE_URL: ""
          VITE_ERROR_REPORTING_URL: ""
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7


  backend-integrated-e2e:
    if: github.ref == 'refs/heads/integration/backend-mvp-real-e2e'
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: visualmath_e2e
          POSTGRES_USER: visualmath
          POSTGRES_PASSWORD: visualmath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visualmath -d visualmath_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: .e2e/backend/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify backend release fixture
        run: test "$(cat .e2e/backend/BACKEND_SHA)" = "809eb92876259caed3c4ad87801851ae167da512"
      - name: Migrate backend database
        working-directory: .e2e/backend
        run: go run ./cmd/migrate up
        env:
          DATABASE_URL: postgres://visualmath:visualmath@127.0.0.1:5432/visualmath_e2e?sslmode=disable
      - name: Start backend release gate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/visualmath-media"
          (
            cd .e2e/backend
            APP_ENV=local \
            HTTP_PORT=8080 \
            DATABASE_URL='postgres://visualmath:visualmath@127.0.0.1:5432/visualmath_e2e?sslmode=disable' \
            JWT_SECRET='0123456789abcdef0123456789abcdef' \
            JWT_ACCESS_TTL='15m' \
            JWT_REFRESH_TTL='24h' \
            REFRESH_COOKIE_NAME='visualmath_e2e_refresh' \
            CORS_ALLOWED_ORIGINS='http://127.0.0.1:4183' \
            LOG_LEVEL='info' \
            MEDIA_ENABLED='true' \
            MEDIA_STORAGE_PATH="$RUNNER_TEMP/visualmath-media" \
            MEDIA_MAX_AUDIO_BYTES='125829120' \
            go run ./cmd/api >"$RUNNER_TEMP/visualmath-backend.log" 2>&1 &
            echo $! >"$RUNNER_TEMP/visualmath-backend.pid"
          )
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/visualmath-backend.log"
          exit 1
      - name: Full product backend E2E
        run: pnpm test:e2e:backend
        env:
          VISUALMATH_E2E_API_BASE_URL: http://127.0.0.1:8080
      - name: Backend log
        if: always()
        run: cat "$RUNNER_TEMP/visualmath-backend.log" || true
      - name: Upload integrated Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-backend
          path: |
            playwright-report-backend/
            test-results/
          retention-days: 7
