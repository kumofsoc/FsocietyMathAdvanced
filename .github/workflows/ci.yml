name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - name: Verify real-backend E2E test registration
        env:
          VISUALMATH_E2E_API_BASE_URL: http://127.0.0.1:65535
        run: |
          pnpm exec playwright test -c playwright.backend.config.ts --list | tee /tmp/backend-e2e-list.txt
          grep -Fq "session management revokes another device without ending the current one" /tmp/backend-e2e-list.txt
          grep -Fq "password change revokes the current session and old credentials" /tmp/backend-e2e-list.txt
          grep -Fq "account export downloads canonical server snapshot without secrets" /tmp/backend-e2e-list.txt
          grep -Fq "self deletion invalidates the account and all credentials" /tmp/backend-e2e-list.txt
      - run: pnpm build
      - name: Enforce JavaScript chunk budget
        run: |
          node --input-type=module <<'NODE'
          import { readdir, stat } from "node:fs/promises";
          import { join } from "node:path";

          const assetsDir = "dist/assets";
          const maxBytes = 1_500_000;
          const entries = await readdir(assetsDir);
          const oversized = [];
          for (const name of entries.filter((entry) => entry.endsWith(".js"))) {
            const size = (await stat(join(assetsDir, name))).size;
            if (size > maxBytes) oversized.push({ name, size });
          }
          if (oversized.length) {
            console.error("JavaScript chunk budget exceeded:", oversized);
            process.exit(1);
          }
          NODE
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          VITE_API_BASE_URL: ""
          VITE_ERROR_REPORTING_URL: ""
      - name: Build production frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://visualmath.invalid \
            --build-arg VITE_API_TIMEOUT_MS=12000 \
            --build-arg VITE_APP_RELEASE=ci \
            --tag visualmath-frontend-ci .
      - name: Smoke production frontend image
        run: |
          docker run -d --rm \
            --name visualmath-frontend-ci-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -p 127.0.0.1:18080:8080 \
            visualmath-frontend-ci
          trap 'docker stop visualmath-frontend-ci-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          test "$(docker exec visualmath-frontend-ci-smoke id -u)" -ne 0
          headers="$(curl -fsSI http://127.0.0.1:18080/)"
          printf '%s\n' "$headers"
          grep -qi '^X-Content-Type-Options: nosniff' <<<"$headers"
          grep -qi '^X-Frame-Options: DENY' <<<"$headers"
          grep -qi '^Referrer-Policy: strict-origin-when-cross-origin' <<<"$headers"
          grep -qi '^Cross-Origin-Opener-Policy: same-origin' <<<"$headers"
          grep -qi '^Content-Security-Policy:' <<<"$headers"
      - name: Browser smoke production frontend image
        run: |
          docker run -d --rm \
            --name visualmath-frontend-ci-browser \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -p 127.0.0.1:18081:8080 \
            visualmath-frontend-ci
          trap 'docker stop visualmath-frontend-ci-browser >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/healthz
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:18081 pnpm exec playwright test e2e/production-image.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
