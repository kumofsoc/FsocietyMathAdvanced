name: Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VISUALMATH_E2E_API_BASE_URL: ${{ vars.VISUALMATH_E2E_API_BASE_URL }}
    steps:
      - name: Require release-gate backend
        run: |
          if [ -z "$VISUALMATH_E2E_API_BASE_URL" ]; then
            echo "::error::VISUALMATH_E2E_API_BASE_URL is required for the MathMaMath release gate."
            exit 1
          fi
          case "$VISUALMATH_E2E_API_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::VISUALMATH_E2E_API_BASE_URL must use HTTPS for the release gate."
              exit 1
              ;;
          esac
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run real-backend release E2E
        run: pnpm test:e2e:backend
      - name: Upload backend Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-release-backend
          path: |
            playwright-report-backend/
            test-results/
          retention-days: 14
